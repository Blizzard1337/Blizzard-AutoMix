// BlizzardAutoMix - main settings.
// Use these commands in the server console or CFG, without a dot or slash prefix.
// Enable: true; disable: false. Previous blizzardautomix_ names remain supported.
// Automatic start requires 10 ready humans; admin .start can also start with fewer.

// MATCH
// Run a knife round before Live. Admin .roundknife toggles the current setting.
knife_enabled_default true

// Seconds allowed for each captain draft pick (minimum: 1; default: 60).
// No pick before the deadline = cancel the draft and return everyone to Ready: 0/10.
// Runtime changes apply from the next pick; use a positive whole number of seconds.
draft_pick_timeout 60

// Enable bots: replace departed players and fill empty places on admin .start.
// false = leave the place empty; spectators can still join through team selection (M).
// Disabling removes existing bots and cancels queued fills, including admin-started matches.
// Re-enabling covers future departures and future admin .start requests.
replace_disconnected_players true

// Reset the match to Ready when connected human participants drop to this count or lower.
// Spectators and bots do not count. 0 = reset only after all human participants leave.
reset_to_ready_player_threshold 5

// true = play every regulation round and disable overtime.
// false = use the normal Live CFG rules. Admin command: .playout.
playout_enabled_default false

// Show the end-of-round report of damage dealt and received.
enable_damage_report true

// CHAT AND MESSAGES
// Prefix for plugin chat messages. {Default} restores the normal text color.
chat_prefix [{Green}Server{Default}]

// Prefix for administrator messages sent with .asay.
admin_chat_prefix [{Red}ADMIN{Default}]

// Stay/Swap chat reminder interval in seconds.
// Ready reminders are separate and checked at a fixed 60-second interval.
chat_messages_timer_delay 13

// Show "AutoMix By Blizzard" when a match starts.
show_credits_on_match_start true

// Server hostname. "" = stop updating the hostname through the plugin.
// Variables: {SERVERNAME}, {TEAM1}, {TEAM2}, {TEAM1_SCORE}, {TEAM2_SCORE},
// {MAP}, {MAPNUMBER}, {MATCH_ID}, {TIME}.
hostname_format "{SERVERNAME} | {TEAM1} [{TEAM1_SCORE}] vs [{TEAM2_SCORE}] {TEAM2}"

// Optional match-start message. "" = disabled; $$$ separates messages.
// Supports the variables above and chat color placeholders.
match_start_message ""

// NEXT-MAP VOTING
// Enable voting. The selected map loads only after the entire match ends.
// Map pool: addons/counterstrikesharp/configs/plugins/BlizzardAutoMix/mapchooser.json
mapchooser_enabled true

// Open voting at the next round start after either team reaches this score.
mapchooser_trigger_score 11

// Maximum vote duration in seconds (minimum configured value: 5).
// Limited to the current Freeze Time; remaining vote menus close when Freeze Time ends.
mapchooser_vote_duration 30

// ADMINISTRATORS
// false = permissions come from admins.json or CounterStrikeSharp.
// true = every player receives BlizzardAutoMix administrator access.
everyone_is_admin false
